<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buddybuddy-toolkit</title>
    <script>
      // 首屏渲染前标记平台：macOS 使用更大的窗口圆角（贴近系统窗口）

        ? "darwin"
        : "win32";
    </script>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
