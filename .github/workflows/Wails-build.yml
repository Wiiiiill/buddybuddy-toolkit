name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            tags: ""
            flags: "-nsis"
            package_name: buddybuddy-toolkit-windows-amd64
          - os: macos-latest
            platform: darwin/universal
            tags: ""
            flags: ""
            package_name: buddybuddy-toolkit-macos-universal
          - os: ubuntu-latest
            platform: linux/amd64
            tags: webkit2_41
            flags: ""
            package_name: buddybuddy-toolkit-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }} ${{ matrix.flags }} ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem build/bin/*-installer.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS installer was not generated"
          }
          Copy-Item build/bin/*-installer.exe ./buddybuddy-toolkit-amd64-installer.exe
          Compress-Archive -Path build/bin/buddybuddy-toolkit.exe -DestinationPath buddybuddy-toolkit-windows-amd64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r -y ../../buddybuddy-toolkit-macos-universal.zip buddybuddy-toolkit.app
          productbuild --component buddybuddy-toolkit.app /Applications ../../buddybuddy-toolkit.pkg

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czf ../../buddybuddy-toolkit-linux-amd64.tar.gz buddybuddy-toolkit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: |
            *.zip
            *.pkg
            *.exe
            *.tar.gz
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.pkg
            *.exe
            *.tar.gz
          generate_release_notes: true
